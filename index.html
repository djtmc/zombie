<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Zombie Survival 3D - Broń swojej bazy przed hordami zombie!">
  <title>Zombie Survival 3D - Ultimate Edition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Arial', sans-serif; background: #000; color: white; overflow: hidden; }
    #container { width: 100vw; height: 100vh; cursor: grab; }
    #container:active { cursor: grabbing; }

    /* UI Panel */
    #ui { position: absolute; top: 15px; left: 15px; z-index: 100; pointer-events: none; max-width: 150px; }
    h1 { margin: 0 0 8px 0; color: #ff4444; text-shadow: 3px 3px 6px #000; font-size: 18px; animation: titleGlow 2s ease-in-out infinite; }
    @keyframes titleGlow { 0%, 100% { text-shadow: 3px 3px 6px #000, 0 0 10px #ff0000; } 50% { text-shadow: 3px 3px 6px #000, 0 0 20px #ff0000; } }
    .stats { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .stat { background: rgba(0, 0, 0, 0.85); padding: 5px 8px; border-radius: 6px; border: 2px solid #444; font-size: 11px; backdrop-filter: blur(10px); transition: all 0.3s; }
    .stat.danger { border-color: #ff0000; background: rgba(139, 0, 0, 0.6); animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .stat-value { color: #4CAF50; font-weight: bold; font-size: 13px; }

    /* Level Display */
    #level-display { background: linear-gradient(135deg, rgba(138, 43, 226, 0.9), rgba(75, 0, 130, 0.9)); padding: 8px 12px; border-radius: 6px; border: 2px solid #9370DB; font-size: 12px; font-weight: bold; text-align: center; margin-bottom: 8px; }
    .level-progress { width: 100%; height: 6px; background: rgba(0, 0, 0, 0.5); border-radius: 4px; margin-top: 4px; overflow: hidden; }
    .level-progress-bar { height: 100%; background: linear-gradient(90deg, #4CAF50, #8BC34A); width: 0%; transition: width 0.5s; }

    /* Buildings Menu */
    #buildings { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 100; flex-wrap: wrap; justify-content: center; max-width: 95vw; }
    .building-btn { background: rgba(44, 95, 45, 0.95); color: white; border: 3px solid #4a7c4e; border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: all 0.3s; backdrop-filter: blur(10px); min-width: 80px; text-align: center; pointer-events: auto; }
    .building-btn:hover:not(:disabled) { background: rgba(61, 127, 62, 0.95); transform: translateY(-5px) scale(1.05); box-shadow: 0 10px 20px rgba(0, 255, 0, 0.3); }
    .building-btn:disabled { background: rgba(85, 85, 85, 0.8); cursor: not-allowed; opacity: 0.5; border-color: #666; }
    .building-btn.selected { background: rgba(61, 127, 62, 0.95); border-color: #0f0; box-shadow: 0 0 20px rgba(0, 255, 0, 0.6); }
    .building-btn.special { background: rgba(138, 43, 226, 0.95); border-color: #9370DB; }
    .building-icon { font-size: 22px; display: block; margin-bottom: 3px; }
    .building-name { font-weight: bold; font-size: 10px; margin-bottom: 2px; }
    .building-cost { font-size: 8px; opacity: 0.9; }

    /* Right side panels */
    #right-panels { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: 240px; pointer-events: auto; }
    .panel { background: rgba(0, 0, 0, 0.85); border-radius: 8px; border: 2px solid #444; backdrop-filter: blur(10px); overflow: hidden; }
    .panel-header { padding: 10px 12px; cursor: pointer; font-weight: bold; color: #4CAF50; display: flex; justify-content: space-between; align-items: center; font-size: 14px; user-select: none; }
    .panel-header .arrow { transition: transform 0.3s; font-size: 11px; }
    .panel.collapsed .panel-header .arrow { transform: rotate(-90deg); }
    .panel-body { padding: 0 12px 12px 12px; font-size: 12px; }
    .panel.collapsed .panel-body { display: none; }
    .setting-item { margin: 8px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .toggle-btn { background: #4CAF50; color: white; border: none; padding: 6px 16px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.3s; }
    .toggle-btn.off { background: #f44336; }

    /* Notifications & Modals */
    #fps { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); padding: 8px 18px; border-radius: 5px; font-size: 15px; color: #4CAF50; font-weight: bold; }
    #notification { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.95); padding: 25px 45px; border-radius: 12px; border: 3px solid #4CAF50; font-size: 20px; font-weight: bold; display: none; z-index: 300; text-align: center; animation: fadeInOut 3s; pointer-events: none; }
    @keyframes fadeInOut { 0%, 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); } 10%, 90% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 400; }
    .modal-content { background: linear-gradient(135deg, #2c2c54, #1a1a3a); padding: 30px; border-radius: 15px; text-align: center; border: 3px solid #d4af37; box-shadow: 0 0 40px rgba(212, 175, 55, 0.5); max-width: 400px; width: 90%; position: relative;}
    .modal-content h2 { font-size: 32px; margin-bottom: 20px; color: #d4af37; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
    .next-level-btn { background: #4CAF50; color: white; border: none; padding: 15px 40px; font-size: 20px; border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight: bold; }
    
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #4CAF50; z-index: 500; text-align: center; }
    
    #exchange { position: absolute; bottom: 15px; right: 15px; background: rgba(0, 0, 0, 0.9); padding: 12px; border-radius: 8px; border: 2px solid #d4af37; z-index: 100; pointer-events: auto; }
    .exchange-btn { background: #d4af37; color: #000; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 4px; font-size: 10px; }

    @media (max-width: 768px) {
      #buildings { bottom: 10px; gap: 5px; }
      .building-btn { min-width: 56px; padding: 6px 8px; }
      .building-icon { font-size: 18px; }
      .building-name { font-size: 9px; }
    }
  </style>
</head>

<body>
  <div id="loading"><div>🧟 ZOMBIE SURVIVAL 3D 🏰</div><div>Ładowanie gry...</div></div>
  <div id="container"></div>
  <div id="fps">FPS: 60</div>
  <div id="notification"></div>

  <div id="ui">
    <h1>🧟 ZOMBIE SURVIVAL 3D 🏰</h1>
    <div id="level-display">
      <div>POZIOM <span id="currentLevel">1</span></div>
      <div style="font-size: 10px; opacity: 0.9; margin-top: 2px;">Cel: <span id="levelGoal">15</span> zombie</div>
      <div class="level-progress"><div class="level-progress-bar" id="levelProgress"></div></div>
    </div>
    <div class="stats">
      <div class="stat" id="baseHP">❤️ HP Bazy<br><span class="stat-value">100</span></div>
      <div class="stat">💰 Złoto<br><span class="stat-value" id="gold">150</span></div>
      <div class="stat">🪵 Drewno<br><span class="stat-value" id="wood">100</span></div>
      <div class="stat" id="waveContainer">🌊 Fala<br><span class="stat-value" id="wave">1 / 2</span></div>
      <div class="stat">🧟 Na mapie<br><span class="stat-value" id="zombieCount">0</span></div>
      <div class="stat">💀 Zabici<br><span class="stat-value" id="killed">0</span></div>
    </div>
  </div>

  <div id="right-panels">
    <div class="panel" id="settings-panel">
      <div class="panel-header" onclick="this.parentElement.classList.toggle('collapsed')"><span>⚙️ Trudność</span><span class="arrow">▼</span></div>
      <div class="panel-body">
        <div class="setting-item"><span>Trudność:</span><button class="toggle-btn" id="difficultyToggle" onclick="event.stopPropagation(); toggleDifficulty()">Ogień w szopie</button></div>
      </div>
    </div>
  </div>

  <div id="exchange">
    <div style="color: #d4af37; font-weight: bold; font-size: 12px; margin-bottom: 5px;">💱 Wymiana</div>
    <button class="exchange-btn" onclick="exchange('goldToWood')">💰→🪵<br><small>20→10</small></button>
    <button class="exchange-btn" onclick="exchange('woodToGold')">🪵→💰<br><small>10→20</small></button>
  </div>

  <div id="buildings">
    <button class="building-btn" onclick="selectBuilding('wall')"><span class="building-icon">✖️</span><div class="building-name">Zasieki</div><div class="building-cost">10 🪵</div></button>
    <button class="building-btn" onclick="selectBuilding('bigwall')"><span class="building-icon">🏗️</span><div class="building-name">Mur</div><div class="building-cost">25 🪵</div></button>
    <button class="building-btn special" onclick="buyWielkaArmata()" id="wielkaArmataBtn"><span class="building-icon">🎯</span><div class="building-name">Wielka Armata</div><div class="building-cost">2000 🪵 2000 💰</div></button>
    <button class="building-btn" onclick="selectBuilding('cannon')"><span class="building-icon">💥</span><div class="building-name">Armata</div><div class="building-cost">30 🪵, 25 💰</div></button>
    <button class="building-btn special" onclick="selectBuilding('soldier')"><span class="building-icon">🪖</span><div class="building-name">Żołnierz</div><div class="building-cost">100 🪵, 150 💰</div></button>
    <button class="building-btn" style="background: rgba(95, 95, 45, 0.95); border-color: #d4af37;" onclick="selectBuilding('sawmill')"><span class="building-icon">🏭</span><div class="building-name">Tartak</div><div class="building-cost">25 🪵, 20 💰</div></button>
    <button class="building-btn" style="background: rgba(95, 95, 45, 0.95); border-color: #d4af37;" onclick="selectBuilding('mine')"><span class="building-icon">⛏️</span><div class="building-name">Kopalnia</div><div class="building-cost">25 🪵, 20 💰</div></button>
  </div>

  <div id="level-complete" class="modal-overlay">
    <div class="modal-content">
      <h2>🎉 POZIOM UKOŃCZONY! 🎉</h2>
      <p style="color: white; margin-bottom: 10px;">Poziom <span id="completedLevel">1</span> zakończony!</p>
      <button class="next-level-btn" onclick="nextLevel()">NASTĘPNY POZIOM ➜</button>
    </div>
  </div>

  <div id="game-over-modal" class="modal-overlay" style="z-index: 600;">
    <div class="modal-content" style="border-color: #ff4444;">
      <h2 style="color: #ff4444;">💀 GAME OVER 💀</h2>
      <p style="margin: 15px 0; font-size: 16px; color:white;">Baza zniszczona!</p>
      <button class="next-level-btn" style="background: #ff4444;" onclick="restartGame()">🔄 NOWA GRA</button>
    </div>
  </div>

  <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ========== CONFIG ==========
    const MAP_WIDTH = 130;  
    const MAP_DEPTH = 70;   
    const BASE_X = MAP_WIDTH / 2 - 6;   
    const ZOMBIE_SPAWN_X = -MAP_WIDTH / 2 + 5; 
    const MAP_TILT = 0.35; // 35% nachylenia
    const CAM_Y = 32;
    const CAM_Z = 45;

    const container = document.getElementById('container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x2a2a4a);

    // GŁÓWNY ŚWIAT POCHYLONY
    const worldGroup = new THREE.Group();
    worldGroup.rotation.x = MAP_TILT;
    scene.add(worldGroup);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(BASE_X + 5, CAM_Y, CAM_Z);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);
    
    const clock = new THREE.Clock();
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableRotate = false; // blokada rotacji
    controls.enableZoom = false;   // blokada zooma
    controls.enablePan = true;
    controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: null, RIGHT: null }; 
    
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(30, 50, 20);
    scene.add(dirLight);

    // ========== DIFFICULTY & WAVES ==========
    let difficultyIndex = 2; 
    const DIFFICULTY_LEVELS = [ 
      { name: 'Łatwa', scale: 0.60, waveInterval: 60 }, 
      { name: 'Średnia', scale: 0.85, waveInterval: 40 }, 
      { name: 'Ogień w szopie', scale: 1.0, waveInterval: 20 } 
    ];

    const game = {
      baseHP: 100, maxBaseHP: 100, gold: 150, wood: 100, zombieKilled: 0,
      selectedBuilding: null, isPlacingBuilding: false, buildingPreview: null,
      resourceTimer: 0,
      
      level: 1, levelKills: 0, levelGoal: 15,
      zombiesSpawnedThisLevel: 0,
      
      // System Fal
      totalWaves: 2, currentWave: 1, 
      waveTimer: 5, // Pierwsza fala startuje szybciej (za 5s)
      zombiesToSpawnThisWave: 0, spawnSubTimer: 0,
      
      bossSpawned: false, difficultyScale: DIFFICULTY_LEVELS[2].scale,
      cageGroup: null, lockedBoss: null,
      wielkaArmataCount: 0
    };

    window.toggleDifficulty = function() {
      difficultyIndex = (difficultyIndex + 1) % DIFFICULTY_LEVELS.length;
      game.difficultyScale = DIFFICULTY_LEVELS[difficultyIndex].scale;
      document.getElementById('difficultyToggle').textContent = DIFFICULTY_LEVELS[difficultyIndex].name;
      showNotification(`Trudność: ${DIFFICULTY_LEVELS[difficultyIndex].name} (Fale co ${DIFFICULTY_LEVELS[difficultyIndex].waveInterval}s)`);
    };

    window.exchange = function(type) {
      if (type === 'goldToWood' && game.gold >= 20) { game.gold -= 20; game.wood += 10; }
      if (type === 'woodToGold' && game.wood >= 10) { game.wood -= 10; game.gold += 20; }
      updateUI();
    };

    // ========== MESHES ==========
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(MAP_WIDTH, MAP_DEPTH),
      new THREE.MeshStandardMaterial({ color: 0x1a3a1a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    worldGroup.add(ground);
    
    const gridHelper = new THREE.GridHelper(100, 50, 0x444444, 0x222222);
    gridHelper.scale.set(MAP_WIDTH / 100, 1, MAP_DEPTH / 100);
    worldGroup.add(gridHelper);

    function createFullCage() {
      const group = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });
      const barGeo = new THREE.CylinderGeometry(0.12, 0.12, 5, 6);
      for (let x = -2.5; x <= 2.5; x += 1) {
        for (let z = -2.5; z <= 2.5; z += 1) {
          if (Math.abs(x) === 2.5 || Math.abs(z) === 2.5) {
            const bar = new THREE.Mesh(barGeo, barMat);
            bar.position.set(x, 2.5, z); group.add(bar);
          }
        }
      }
      const roof = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.4, 5.2), barMat);
      roof.position.set(0, 5, 0); group.add(roof);
      return group;
    }

    function createZombieMesh() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.8, 0.4), new THREE.MeshStandardMaterial({ color: 0x228B22 })); body.position.y = 1.2; g.add(body);
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ color: 0x90EE90 })); head.position.y = 2.3; g.add(head);
      return g;
    }

    function setupLevel() {
      game.levelGoal = (game.level === 1) ? 15 : game.level * 10;
      game.totalWaves = Math.ceil(game.levelGoal / 10);
      game.currentWave = 1;
      game.zombiesSpawnedThisLevel = 0;
      game.zombiesToSpawnThisWave = 0; 
      game.waveTimer = 3; // Pierwsza fala szybko wchodzi
      game.bossSpawned = false;

      if (game.cageGroup) worldGroup.remove(game.cageGroup);
      if (game.lockedBoss) worldGroup.remove(game.lockedBoss.mesh);
      
      game.cageGroup = createFullCage();
      game.cageGroup.position.set(ZOMBIE_SPAWN_X, 0, 0);
      worldGroup.add(game.cageGroup);

      // BALANS BOSSA (Zależy od poziomu i trudności)
      const bossHP = game.levelGoal * 35 * game.level * game.difficultyScale;
      const bossDamage = (30 + game.level * 15) * game.difficultyScale;
      
      const mesh = createZombieMesh();
      mesh.scale.set(3.5, 3.5, 3.5);
      mesh.position.set(ZOMBIE_SPAWN_X, 0, 0);
      worldGroup.add(mesh);

      game.lockedBoss = {
        mesh: mesh, hp: bossHP, maxHP: bossHP, speed: 0.05, damage: bossDamage,
        position: new THREE.Vector3(ZOMBIE_SPAWN_X, 0, 0), isBoss: true, isActive: false 
      };
      zombies.push(game.lockedBoss);
      
      updateUI();
    }

    const armataSlots = [
      { x: MAP_WIDTH / 2 - MAP_WIDTH * 0.25, z: -MAP_DEPTH / 2 + 3 },
      { x: MAP_WIDTH / 2 - MAP_WIDTH * 0.25, z: MAP_DEPTH / 2 - 3 },
      { x: 0, z: -MAP_DEPTH / 2 + 3 },
      { x: 0, z: MAP_DEPTH / 2 - 3 }
    ];

    const buildingTypes = {
      wall: { cost: { wood: 10, gold: 0 }, hp: 100, h: 2.5, w: 1.5, type: 'block' },
      bigwall: { cost: { wood: 25, gold: 0 }, hp: 250, h: 4, w: 2, type: 'block' },
      wielkaArmata: { cost: { wood: 2000, gold: 2000 }, hp: 300, range: 35, damage: 200, fireRate: 40 },
      cannon: { cost: { wood: 30, gold: 25 }, hp: 70, h: 3, range: 22, damage: 60, fireRate: 70 },
      soldier: { cost: { wood: 100, gold: 150 }, hp: 120, h: 1.8, range: 18, damage: 40, fireRate: 30 },
      sawmill: { cost: { wood: 25, gold: 20 }, hp: 60, h: 2.5, woodPS: 2 },
      mine: { cost: { wood: 25, gold: 20 }, hp: 60, h: 2.5, goldPS: 3 }
    };

    const baseGroup = new THREE.Group();
    const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(4,5,4), new THREE.MeshStandardMaterial({ color: 0x4169e1 })); baseMesh.position.y = 2.5; baseGroup.add(baseMesh);
    worldGroup.add(baseGroup);
    baseGroup.position.set(BASE_X, 0, 0);

    const zombies = []; const buildings = []; const projectiles = [];

    function createBuildingMesh(type) {
      const def = buildingTypes[type];
      const g = new THREE.Group();
      if(type === 'cannon' || type === 'wielkaArmata') {
        const c = new THREE.Mesh(new THREE.CylinderGeometry(1,1,2), new THREE.MeshStandardMaterial({color:0x444})); c.position.y=1; g.add(c);
      } else {
        const c = new THREE.Mesh(new THREE.BoxGeometry(def.w||2, def.h||2, def.w||2), new THREE.MeshStandardMaterial({color:0x8b4513})); c.position.y=(def.h||2)/2; g.add(c);
      }
      return g;
    }

    // ========== SYSTEM BUDOWANIA Z PODGLĄDEM ==========
    function canAfford(type) {
      const cost = buildingTypes[type].cost;
      return game.wood >= cost.wood && game.gold >= cost.gold;
    }

    window.selectBuilding = function(type) {
      if (!canAfford(type)) return;
      game.selectedBuilding = type;
      game.isPlacingBuilding = true;
      if (game.buildingPreview) worldGroup.remove(game.buildingPreview);
      
      game.buildingPreview = createBuildingMesh(type);
      // Półprzezroczysty materiał podglądu
      game.buildingPreview.traverse((child) => {
        if (child.isMesh) {
          child.material = child.material.clone();
          child.material.transparent = true; child.material.opacity = 0.6;
          child.material.emissive = new THREE.Color(0x00ff00);
          child.material.emissiveIntensity = 0.3;
        }
      });
      worldGroup.add(game.buildingPreview);
    };

    function cancelBuilding() {
      game.isPlacingBuilding = false;
      game.selectedBuilding = null;
      if (game.buildingPreview) {
        worldGroup.remove(game.buildingPreview);
        game.buildingPreview = null;
      }
    }

    window.buyWielkaArmata = function() {
      if(game.wielkaArmataCount >= 4) return showNotification("Limit wielkich armat osiągnięty!");
      if(canAfford('wielkaArmata')) {
        game.wood -= 2000; game.gold -= 2000;
        const slot = armataSlots[game.wielkaArmataCount];
        const mesh = createBuildingMesh('wielkaArmata');
        mesh.position.set(slot.x, 1, slot.z);
        worldGroup.add(mesh);
        buildings.push({ mesh, type: 'wielkaArmata', hp: 300, cooldown: 0, position: mesh.position.clone() });
        game.wielkaArmataCount++;
        updateUI();
      }
    }

    // Nasłuchiwanie myszki do podglądu budowania na pochylonej mapie
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let mousePos3D = new THREE.Vector3();
    
    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      
      if (game.isPlacingBuilding && game.buildingPreview) {
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObject(ground);
        if (intersects.length > 0) {
          // Transformacja punktu 3D do zrotowanej grupy worldGroup
          const localPoint = worldGroup.worldToLocal(intersects[0].point.clone());
          const x = Math.round(localPoint.x / 2) * 2;
          const z = Math.round(localPoint.z / 2) * 2;
          game.buildingPreview.position.set(x, 0, z);
          mousePos3D.set(x, 0, z);
        }
      }
    });

    window.addEventListener('click', (e) => {
      if (e.target !== renderer.domElement) return; // Zapobiega klikaniu przez UI
      
      if (game.isPlacingBuilding && game.selectedBuilding) {
        const type = game.selectedBuilding;
        if (canAfford(type)) {
          game.wood -= buildingTypes[type].cost.wood;
          game.gold -= buildingTypes[type].cost.gold;
          
          const b = createBuildingMesh(type);
          b.position.copy(mousePos3D);
          worldGroup.add(b);
          buildings.push({ mesh: b, type: type, hp: buildingTypes[type].hp, cooldown: 0, position: b.position.clone() });
          
          cancelBuilding();
          updateUI();
        }
      }
    });

    window.addEventListener('keydown', (e) => { if(e.key === 'Escape') cancelBuilding(); });

    // ========== GAME LOOP ==========
    function showNotification(text) {
      const n = document.getElementById('notification');
      n.textContent = text; n.style.display = 'block';
      setTimeout(() => n.style.display = 'none', 3000);
    }

    const tempVec = new THREE.Vector3();

    function update(delta) {
      if (game.baseHP <= 0 && !isGameOver) { 
        isGameOver = true; 
        document.getElementById('game-over-modal').style.display = 'flex'; 
        return; 
      }

      // Ekonomia (co 60 klatek przy 60FPS)
      game.resourceTimer += delta;
      if (game.resourceTimer >= 1) {
        buildings.forEach(b => {
          if (b.type === 'sawmill') game.wood += buildingTypes.sawmill.woodPS;
          if (b.type === 'mine') game.gold += buildingTypes.mine.goldPS;
        });
        game.resourceTimer = 0;
        updateUI();
      }

      // ========== SYSTEM FAL ZOMBIE ==========
      if (!game.bossSpawned) {
        if (game.zombiesToSpawnThisWave > 0) {
          game.spawnSubTimer -= delta;
          if (game.spawnSubTimer <= 0) {
            // Wyrzuć jednego zombie na mapę
            const zPos = (Math.random() - 0.5) * (MAP_DEPTH - 10);
            const mesh = createZombieMesh();
            mesh.position.set(ZOMBIE_SPAWN_X, 0, zPos);
            worldGroup.add(mesh);
            zombies.push({ mesh: mesh, hp: 50 * game.difficultyScale, speed: 0.04, damage: 10 * game.difficultyScale, position: new THREE.Vector3(ZOMBIE_SPAWN_X, 0, zPos), isActive: true });
            
            game.zombiesSpawnedThisLevel++;
            game.zombiesToSpawnThisWave--;
            game.spawnSubTimer = 0.5; // Co 0.5 sekundy wychodzi kolejny, aż wystrzela limit fali
            updateUI();
          }
        } 
        else if (game.zombiesSpawnedThisLevel < game.levelGoal) {
          // Oczekiwanie na nową falę
          game.waveTimer -= delta;
          if (game.waveTimer <= 0) {
            game.currentWave++;
            const interval = DIFFICULTY_LEVELS[difficultyIndex].waveInterval;
            game.waveTimer = interval;
            game.zombiesToSpawnThisWave = Math.min(10, game.levelGoal - game.zombiesSpawnedThisLevel);
            showNotification(`🌊 FALA ${game.currentWave}/${game.totalWaves} ROZPOCZĘTA!`);
            updateUI();
          }
        }
      }

      // Otwarcie klatki gdy zabijemy cel zombie
      if (!game.bossSpawned && game.levelKills >= game.levelGoal && game.lockedBoss) {
        game.bossSpawned = true;
        game.lockedBoss.isActive = true;
        worldGroup.remove(game.cageGroup);
        game.cageGroup = null;
        showNotification(`👑 KLATKA OTWARTA! BOSS ATAKUJE!`);
      }

      // Zombie ruch
      for (let i = zombies.length - 1; i >= 0; i--) {
        const z = zombies[i];
        if (!z.isActive) continue; 

        // Znajdź najbliższy budynek LUB bazę
        let targetPos = baseGroup.position;
        let targetObj = { hpContainer: game, isBase: true };
        let minDistSq = z.position.distanceToSquared(baseGroup.position);

        buildings.forEach(b => {
            const d = z.position.distanceToSquared(b.position);
            if(d < minDistSq) { minDistSq = d; targetPos = b.position; targetObj = { hpContainer: b, isBase: false }; }
        });

        tempVec.subVectors(targetPos, z.position).normalize();
        
        if (minDistSq > 5) {
          z.position.add(tempVec.multiplyScalar(z.speed));
          z.mesh.position.copy(z.position);
          z.mesh.rotation.y = Math.atan2(tempVec.x, tempVec.z);
        } else {
          // Obrażenia dla bazy lub budynku
          if(targetObj.isBase) {
             game.baseHP -= z.damage * delta;
          } else {
             targetObj.hpContainer.hp -= z.damage * delta;
             if(targetObj.hpContainer.hp <= 0) {
                 worldGroup.remove(targetObj.hpContainer.mesh);
                 buildings.splice(buildings.indexOf(targetObj.hpContainer), 1);
             }
          }
        }

        if (z.hp <= 0) {
          worldGroup.remove(z.mesh);
          zombies.splice(i, 1);
          if (z.isBoss) {
            game.gold += 300 * game.level; game.wood += 200 * game.level;
            document.getElementById('level-complete').style.display = 'flex';
          } else {
            game.zombieKilled++; game.levelKills++;
            game.gold += 5;
          }
          updateUI();
        }
      }

      // Wieże strzelają
      buildings.forEach(b => {
        const def = buildingTypes[b.type];
        if(def.range) {
          b.cooldown -= delta * 60; // cooldown w 'klatkach' dla wstecznej kompatybilności
          if (b.cooldown <= 0) {
            const targetZ = zombies.find(zmb => zmb.isActive && b.position.distanceTo(zmb.position) < def.range);
            if(targetZ) {
              const pMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshStandardMaterial({color:0xff0000}));
              pMesh.position.copy(b.position); pMesh.position.y += 2;
              worldGroup.add(pMesh);
              projectiles.push({ mesh: pMesh, pos: pMesh.position.clone(), target: targetZ, dmg: def.damage, life: 60 });
              b.cooldown = def.fireRate;
            }
          }
        }
      });

      // Pociski
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.life--;
        // Śledzenie celu
        if(p.target && p.target.isActive) {
           tempVec.subVectors(p.target.position, p.pos).normalize();
           p.pos.add(tempVec.multiplyScalar(0.8));
           p.mesh.position.copy(p.pos);
           if(p.pos.distanceTo(p.target.position) < 2) {
              p.target.hp -= p.dmg;
              worldGroup.remove(p.mesh); projectiles.splice(i,1);
           }
        } else {
           worldGroup.remove(p.mesh); projectiles.splice(i,1); // Cel zginął zanim pocisk doleciał
        }
      }
    }

    function updateUI() {
      document.getElementById('baseHP').querySelector('.stat-value').textContent = Math.max(0, Math.floor(game.baseHP));
      document.getElementById('gold').textContent = Math.floor(game.gold);
      document.getElementById('wood').textContent = Math.floor(game.wood);
      document.getElementById('zombieCount').textContent = zombies.filter(z=>z.isActive).length;
      document.getElementById('killed').textContent = game.zombieKilled;
      document.getElementById('wave').textContent = `${game.currentWave} / ${game.totalWaves}`;
      document.getElementById('levelProgress').style.width = Math.min(100, (game.levelKills/game.levelGoal)*100) + '%';
    }

    window.nextLevel = function() {
      game.level++; 
      document.getElementById('level-complete').style.display = 'none';
      document.getElementById('currentLevel').textContent = game.level;
      setupLevel();
    };

    window.restartGame = function() { location.reload(); };

    // ========== MAIN LOOP ==========
    let isGameOver = false;
    let lastTime = 0;

    function animate(time) {
      requestAnimationFrame(animate);
      const delta = (time - lastTime) / 1000 || 0.016;
      lastTime = time;
      
      // Sterowanie kamerą tylko X
      if (panKeys.left) camera.position.x -= 30 * delta;
      if (panKeys.right) camera.position.x += 30 * delta;
      
      camera.position.y = CAM_Y;
      camera.position.z = CAM_Z;
      if(camera.position.x > MAP_WIDTH/2 + 5) camera.position.x = MAP_WIDTH/2 + 5;
      if(camera.position.x < -MAP_WIDTH/2 - 5) camera.position.x = -MAP_WIDTH/2 - 5;
      controls.target.set(camera.position.x - 15, 0, 0);

      update(Math.min(delta, 0.1)); // Max cap
      controls.update();
      renderer.render(scene, camera);
    }
    
    document.getElementById('loading').style.display = 'none';
    setupLevel();
    animate(performance.now());
  </script>
</body>
</html>

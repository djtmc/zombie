<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOSQ — Oficjalny Motion Graphics Showreel 30s</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,500;0,700;0,900;1,800&family=Playfair+Display:ital,wght@0,600;0,800;1,700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #080706;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* Format kinowy 16:9 */
      max-height: 56.25vw;
      background: #000;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }
    canvas#videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* Pasek kontrolny na dole */
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      background: linear-gradient(to top, rgba(10, 8, 7, 0.95), rgba(10, 8, 7, 0.4) 65%, transparent);
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 50;
    }
    #stage-container:hover .controls-overlay {
      opacity: 1;
      transform: translateY(0);
    }
    .scrubber-container {
      position: relative;
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      cursor: pointer;
      transition: height 0.2s;
    }
    .scrubber-container:hover {
      height: 10px;
    }
    .scrubber-bar {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #d4af37, #f6cf70, #ffffff);
      box-shadow: 0 0 15px rgba(246, 207, 112, 0.8);
      border-radius: 4px;
      pointer-events: none;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
    }
    .btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .time-badge {
      font-size: 13px;
      font-weight: 700;
      color: #e5e5e5;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }
    .badge-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(212, 175, 55, 0.2);
      color: #f7d070;
      border: 1px solid rgba(247, 208, 112, 0.4);
      letter-spacing: 1px;
    }

    /* Ekran startowy z odblokowaniem audio */
    #start-overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(30, 24, 18, 0.88) 0%, rgba(8, 7, 6, 0.98) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(12px);
      cursor: pointer;
      transition: opacity 0.5s ease;
    }
    #start-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .play-orb {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f7d070, #c89d2d);
      box-shadow: 0 10px 45px rgba(212, 175, 55, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      animation: pulse-glow 2s infinite ease-out;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .play-orb:hover {
      transform: scale(1.12);
    }
    .play-orb svg {
      width: 44px;
      height: 44px;
      fill: #14110e;
      margin-left: 6px;
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 10px 40px rgba(212, 175, 55, 0.5), 0 0 0 0 rgba(247, 208, 112, 0.4); }
      70% { box-shadow: 0 10px 40px rgba(212, 175, 55, 0.5), 0 0 0 28px rgba(247, 208, 112, 0); }
      100% { box-shadow: 0 10px 40px rgba(212, 175, 55, 0.5), 0 0 0 0 rgba(247, 208, 112, 0); }
    }
    .start-title {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -1px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #ffffff 30%, #e2cfb4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .start-subtitle {
      font-size: 17px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 24px;
    }
    .cta-hint {
      font-size: 13px;
      font-weight: 800;
      color: #f7d070;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      padding: 9px 24px;
      border-radius: 30px;
      background: rgba(247, 208, 112, 0.12);
      border: 1px solid rgba(247, 208, 112, 0.4);
    }
  </style>
</head>
<body>

  <div id="stage-container">
    <canvas id="videoCanvas" width="1920" height="1080"></canvas>

    <!-- Start / Play Interactivity Screen -->
    <div id="start-overlay">
      <div class="play-orb">
        <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <div class="start-title">WOSQ — MOTION SHOWREEL</div>
      <div class="start-subtitle">Ekskluzywne Bukiety Kwiatowe & Świece Sojowe</div>
      <div class="cta-hint">KLIKNIJ, ABY OBEJRZEĆ WIDEO Z DŹWIĘKIEM (30S)</div>
    </div>

    <!-- Pasek kontrolny -->
    <div class="controls-overlay" id="controlsOverlay">
      <div class="scrubber-container" id="scrubber">
        <div class="scrubber-bar" id="progressBar"></div>
      </div>
      <div class="controls-row">
        <div class="controls-left">
          <button class="btn" id="playBtn" title="Odtwórz / Pauza">
            <svg id="playIcon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
          </button>
          <button class="btn" id="restartBtn" title="Restart od 00:00">
            <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
          </button>
          <div class="time-badge" id="timeDisplay">00:00 / 00:30</div>
        </div>
        <div class="controls-right">
          <span class="badge-pill">60 FPS • BEAT-SYNC 120 BPM</span>
          <button class="btn" id="soundBtn" title="Wycisz / Dźwięk">
            <svg id="soundOnIcon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="soundOffIcon" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <button class="btn" id="fsBtn" title="Pełny ekran">
            <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. ZARZĄDZANIE GRAFIKAMI I ASSETAMI (BEZ BLOKADY CORS)
       ========================================================================== */
    const ASSETS = {
      logo: 'input_file_0.png',
      bouquet: 'input_file_1.png',
      gifts: 'input_file_2.png'
    };

    const images = {};
    let loadedCount = 0;
    const totalCount = Object.keys(ASSETS).length;

    function loadImages(onReady) {
      for (const [key, src] of Object.entries(ASSETS)) {
        const img = new Image();
        // Usunięto crossOrigin='anonymous', aby uniknąć błędów CORS w lokalnym środowisku
        img.src = src;
        img.onload = () => {
          loadedCount++;
          if (loadedCount === totalCount && onReady) onReady();
        };
        img.onerror = () => {
          console.warn("Plik graficzny może ładować się z opóźnieniem:", src);
          loadedCount++;
          if (loadedCount === totalCount && onReady) onReady();
        };
        images[key] = img;
      }
    }

    /* ==========================================================================
       2. NIEZAWODNE FUNKCJE EASING (BEZ BRAKUJĄCYCH METOD)
       ========================================================================== */
    const ease = {
      linear: t => t,
      inQuad: t => t * t,
      outQuad: t => t * (2 - t),
      inOutQuad: t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t,
      inCubic: t => t * t * t,
      outCubic: t => (--t) * t * t + 1,
      inOutCubic: t => t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1,
      inExpo: t => (t === 0) ? 0 : Math.pow(2, 10 * (t - 1)),
      outExpo: t => (t === 1) ? 1 : 1 - Math.pow(2, -10 * t),
      outBack: (t, s = 1.70158) => {
        t = t - 1;
        return t * t * ((s + 1) * t + s) + 1;
      },
      elasticOut: (t) => {
        if (t === 0) return 0;
        if (t === 1) return 1;
        return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1;
      }
    };

    /* ==========================================================================
       3. WBUDOWANY SILNIK AUDIO (ZOPTYMALIZOWANY, ZERO LAGÓW)
       ========================================================================== */
    class ShowreelAudio {
      constructor() {
        this.ctx = null;
        this.master = null;
        this.isMuted = false;
        this.snareBuffer = null;
        this.whooshBuffer = null;
      }

      init() {
        if (this.ctx) return;
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioContext();
        this.master = this.ctx.createGain();
        this.master.gain.setValueAtTime(0.8, this.ctx.currentTime);
        this.master.connect(this.ctx.destination);

        // Pre-render buforów szumów (zapobiega zacinaniu animacji w trakcie odtwarzania)
        const sSize = Math.floor(this.ctx.sampleRate * 0.18);
        this.snareBuffer = this.ctx.createBuffer(1, sSize, this.ctx.sampleRate);
        const sData = this.snareBuffer.getChannelData(0);
        for (let i = 0; i < sSize; i++) {
          sData[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.035));
        }

        const wSize = Math.floor(this.ctx.sampleRate * 0.6);
        this.whooshBuffer = this.ctx.createBuffer(1, wSize, this.ctx.sampleRate);
        const wData = this.whooshBuffer.getChannelData(0);
        for (let i = 0; i < wSize; i++) {
          wData[i] = (Math.random() * 2 - 1);
        }
      }

      toggleMute() {
        if (!this.master) return false;
        this.isMuted = !this.isMuted;
        this.master.gain.setTargetAtTime(this.isMuted ? 0 : 0.8, this.ctx.currentTime, 0.05);
        return this.isMuted;
      }

      kick(t) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.master);
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(36, t + 0.15);
        gain.gain.setValueAtTime(1.0, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.start(t);
        osc.stop(t + 0.32);
      }

      snare(t) {
        if (!this.ctx || this.isMuted || !this.snareBuffer) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this.snareBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 1000;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.65, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        src.start(t);
      }

      hat(t, accent = false) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(8000 + Math.random() * 800, t);
        gain.gain.setValueAtTime(accent ? 0.25 : 0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.05);
      }

      whoosh(t) {
        if (!this.ctx || this.isMuted || !this.whooshBuffer) return;
        const src = this.ctx.createBufferSource();
        src.buffer = this.whooshBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.5;
        filter.frequency.setValueAtTime(250, t);
        filter.frequency.exponentialRampToValueAtTime(3200, t + 0.5);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.01, t);
        gain.gain.linearRampToValueAtTime(0.3, t + 0.25);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.master);
        src.start(t);
      }

      synthChord(notes, t, dur = 1.8) {
        if (!this.ctx || this.isMuted) return;
        notes.forEach(f => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const filter = this.ctx.createBiquadFilter();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(f, t);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(600, t);
          filter.frequency.exponentialRampToValueAtTime(2800, t + 0.25);
          filter.frequency.exponentialRampToValueAtTime(800, t + dur);
          gain.gain.setValueAtTime(0.0, t);
          gain.gain.linearRampToValueAtTime(0.09, t + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(filter);
          filter.connect(gain);
          gain.connect(this.master);
          osc.start(t);
          osc.stop(t + dur);
        });
      }

      bass(f, t, dur = 0.4) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + dur);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + dur);
      }

      sparkle(t, f = 1600) {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.18, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain);
        gain.connect(this.master);
        osc.start(t);
        osc.stop(t + 0.4);
      }
    }

    const audio = new ShowreelAudio();

    /* ==========================================================================
       4. SYNCHRONIZACJA RYTMICZNA (120 BPM = 2 UDERZENIA NA SEKUNDĘ)
       ========================================================================== */
    const DURATION = 30.0;
    let currentTime = 0;
    let isPlaying = false;
    let lastTimestamp = 0;
    let lastBeat = -1;

    // Progresja akordów (Luxury Future Pop w Dm9 - G13 - Cmaj9 - Am9)
    const chords = [
      { bass: 73.4, notes: [146.8, 174.6, 220.0, 261.6, 329.6] },
      { bass: 49.0, notes: [98.0, 174.6, 246.9, 329.6] },
      { bass: 65.4, notes: [130.8, 164.8, 196.0, 246.9, 293.7] },
      { bass: 55.0, notes: [110.0, 130.8, 164.8, 196.0, 246.9] }
    ];

    function handleAudioSync(t) {
      if (!audio.ctx || !isPlaying) return;
      const beat = Math.floor(t * 2);
      if (beat !== lastBeat) {
        lastBeat = beat;
        const now = audio.ctx.currentTime;
        const beatInBar = beat % 4;
        const bar = Math.floor(beat / 4);

        // Efekty przejść między scenami
        if (beat === 0) audio.kick(now);
        if (beat === 10) { audio.whoosh(now); audio.kick(now + 0.1); }
        if (beat === 24) { audio.whoosh(now); audio.kick(now + 0.1); }
        if (beat === 38) { audio.whoosh(now); audio.kick(now + 0.1); }
        if (beat === 48) { audio.kick(now); audio.sparkle(now, 2200); }

        // Intro (0 - 5.0s)
        if (t < 5.0) {
          if (beatInBar === 0 || beatInBar === 2) audio.kick(now);
          if (beat % 2 === 1) audio.sparkle(now, 1000 + beat * 120);
          return;
        }

        // Pełen Beat od 5.0s do 29.0s
        if (t >= 5.0 && t <= 29.0) {
          // Stopa na 1 i 3
          if (beatInBar === 0 || beatInBar === 2) audio.kick(now);
          // Werbel na 2 i 4
          if (beatInBar === 1 || beatInBar === 3) audio.snare(now);

          // Hi-Haty ósemkowe
          audio.hat(now, beatInBar === 0);
          audio.hat(now + 0.25, false);

          // Akord i bas na początku taktu
          if (beatInBar === 0) {
            const ch = chords[bar % chords.length];
            audio.synthChord(ch.notes, now, 1.85);
            audio.bass(ch.bass, now, 0.45);
          }
          if (beatInBar === 2) {
            const ch = chords[bar % chords.length];
            audio.bass(ch.bass * 1.5, now, 0.3);
          }
          if (beat % 2 === 1) {
            audio.sparkle(now + 0.25, 1400 + (beat % 5) * 200);
          }
        }
      }
    }

    /* ==========================================================================
       5. SYSTEM CZĄSTECZEK (PŁYNNE WOSKOWE PŁATKI I ZŁOTE DROBINY)
       ========================================================================== */
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');

    const particles = [];
    for (let i = 0; i < 65; i++) {
      particles.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        size: 3 + Math.random() * 7,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -0.6 - Math.random() * 1.4,
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.04,
        color: ['#f6cf70', '#ffffff', '#e3a587', '#a5c4d4', '#e2c290'][Math.floor(Math.random() * 5)]
      });
    }

    function drawParticles(opacity = 1) {
      ctx.save();
      ctx.globalAlpha = opacity;
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vRot;
        if (p.y < -40) p.y = 1120;
        if (p.x < -40) p.x = 1960;
        if (p.x > 1960) p.x = -40;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;

        // Płatek woskowy
        ctx.beginPath();
        ctx.moveTo(0, -p.size * 1.8);
        ctx.bezierCurveTo(p.size, -p.size * 0.8, p.size, p.size, 0, p.size * 1.6);
        ctx.bezierCurveTo(-p.size, p.size, -p.size, -p.size * 0.8, 0, -p.size * 1.8);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    /* ==========================================================================
       6. DEKOMPOZYCJA ASSETÓW: ANIMOWANE KOMPONENTY
       ========================================================================== */

    // Rysowanie zoptymalizowanego logo WOSQ (obsługuje plik graficzny + fallback wektorowy)
    function drawWosqLogo(x, y, scale = 1, alpha = 1, lightSheen = 0) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.globalAlpha = alpha;

      if (images.logo && images.logo.complete && images.logo.naturalWidth > 0) {
        const lw = 460;
        const lh = lw * (images.logo.height / images.logo.width);
        ctx.shadowColor = 'rgba(246, 207, 112, 0.7)';
        ctx.shadowBlur = 35;
        ctx.drawImage(images.logo, -lw / 2, -lh / 2, lw, lh);
      } else {
        // Profesjonalny komponent wektorowy WOSQ
        ctx.font = '900 135px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#d4af37';
        ctx.shadowBlur = 40;
        ctx.fillText("WOSQ", 0, 0);
      }

      // Dynamiczny połysk świetlny (Light Sweep)
      if (lightSheen > 0) {
        ctx.save();
        ctx.globalCompositeOperation = 'source-atop';
        const sx = -300 + lightSheen * 600;
        const grad = ctx.createLinearGradient(sx - 80, -100, sx + 80, 100);
        grad.addColorStop(0, 'rgba(255, 255, 255, 0)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
        grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = grad;
        ctx.fillRect(-250, -120, 500, 240);
        ctx.restore();
      }
      ctx.restore();
    }

    // Dekonstrukcja bukietu: komponenty płatków i kwiatów w 3D
    function drawFlowerPetal(x, y, radius, color, rot, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.scale(scale, scale);
      ctx.fillStyle = color;
      ctx.shadowColor = 'rgba(0,0,0,0.15)';
      ctx.shadowBlur = 12;

      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i * Math.PI * 2) / 8;
        const px = Math.cos(ang) * radius;
        const py = Math.sin(ang) * radius;
        ctx.arc(px * 0.6, py * 0.6, radius * 0.45, 0, Math.PI * 2);
      }
      ctx.fill();

      // Środek kwiatka
      ctx.fillStyle = '#f6cf70';
      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Dekonstrukcja świąteczna: zawieszki, gwiazdki, wstążki
    function drawRibbonBadge(x, y, text, color = '#a62b2b', scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 20;

      // Korpus wstęgi
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-170, -26, 340, 52, 14);
      ctx.fill();

      // Złote przeszycie
      ctx.strokeStyle = '#f6cf70';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Tekst
      ctx.font = '800 15px "Plus Jakarta Sans"';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    /* ==========================================================================
       7. SCENY SHOWREELU (DOKŁADNIE 30 SEKUND)
       ========================================================================== */

    // SCENA 1: EKSCYTUJĄCY INTRO BIAŁO-ZŁOTY HOOK (0.0s - 5.0s)
    function renderScene1(t) {
      const w = 1920, h = 1080;

      // Eleganckie, ciemne tło z promienistym złotym światłem
      const bg = ctx.createRadialGradient(w / 2, h / 2, 60, w / 2, h / 2, 900);
      bg.addColorStop(0, '#2b2118');
      bg.addColorStop(0.6, '#13100d');
      bg.addColorStop(1, '#080706');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Koncentryczne kręgi woskowe
      ctx.save();
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.15)';
      ctx.lineWidth = 2;
      for (let r = 120; r <= 840; r += 160) {
        ctx.beginPath();
        ctx.arc(w / 2, h / 2, r + Math.sin(t * 3 + r) * 15, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      drawParticles(0.7);

      // Wejście Logo WOSQ z elastycznym wybiciem
      const logoProg = Math.min(1, Math.max(0, (t - 0.2) / 1.0));
      const s = 0.4 + ease.elasticOut(logoProg) * 0.6;
      const sheen = (t > 1.2 && t < 2.8) ? (t - 1.2) / 1.6 : 0;
      drawWosqLogo(w / 2, h / 2 - 60, s, Math.min(1, t / 0.4), sheen);

      // Hasło: "MANUFAKTURA EMOCJI Z WOSKU SOJOWEGO"
      const t1Prog = Math.min(1, Math.max(0, (t - 1.0) / 0.7));
      if (t1Prog > 0) {
        ctx.save();
        const yOff = (1 - ease.outBack(t1Prog)) * 40;
        ctx.translate(w / 2, h / 2 + 150 + yOff);
        ctx.globalAlpha = t1Prog;

        // Pigułka brandowa
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.strokeStyle = 'rgba(246, 207, 112, 0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.roundRect(-280, -24, 560, 48, 24);
        ctx.fill();
        ctx.stroke();

        ctx.font = '800 17px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f6cf70';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.letterSpacing = '5px';
        ctx.fillText("POLSKA MANUFAKTURA ZAPACHOWA", 0, 0);
        ctx.restore();
      }

      // Hasło 2: Kaligraficzne rozwinięcie
      const t2Prog = Math.min(1, Math.max(0, (t - 2.2) / 0.7));
      if (t2Prog > 0) {
        ctx.save();
        ctx.globalAlpha = t2Prog;
        const scale2 = 0.85 + ease.outBack(t2Prog) * 0.15;
        ctx.translate(w / 2, h / 2 + 235);
        ctx.scale(scale2, scale2);

        ctx.font = 'italic 700 42px "Playfair Display"';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.5)';
        ctx.shadowBlur = 25;
        ctx.fillText("Bukiety & Świece, które nigdy nie więdną.", 0, 0);
        ctx.restore();
      }

      // Płynne rozbłyskowe przejście do sceny 2
      if (t > 4.6) {
        const flash = (t - 4.6) / 0.4;
        ctx.fillStyle = `rgba(255, 250, 240, ${ease.inQuad(flash)})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // SCENA 2: EKSKLUZYWNY BUKIET KWIATOWY Z WOSKU (5.0s - 12.0s)
    function renderScene2(t) {
      const st = t - 5.0; // czas sceny: 0.0 - 7.0s
      const w = 1920, h = 1080;

      // Ciepłe kremowo-lniane tło showroomu
      const bg = ctx.createLinearGradient(0, 0, w, h);
      bg.addColorStop(0, '#f7f2eb');
      bg.addColorStop(0.5, '#eae2d5');
      bg.addColorStop(1, '#dfd3c3');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Pływający w tle kinetyczny napis (Marquee)
      ctx.save();
      ctx.font = '900 210px "Plus Jakarta Sans"';
      ctx.fillStyle = 'rgba(165, 138, 110, 0.1)';
      ctx.textBaseline = 'middle';
      const offset = (st * -110) % 1920;
      ctx.fillText("100% WOSK SOJOWY • HANDMADE ART • ", offset, 240);
      ctx.fillText("100% WOSK SOJOWY • HANDMADE ART • ", offset + 1920, 240);
      ctx.restore();

      drawParticles(0.8);

      // PREZENTACJA BUKIETU (kompozycja w łuku z cieniem 3D)
      const cardProg = Math.min(1, st / 0.8);
      const cardX = w * 0.66 + (1 - ease.outBack(cardProg)) * 400;
      const cardY = h * 0.52 + Math.sin(st * 2.2) * 16;
      const cardRot = Math.sin(st * 1.6) * 0.03;

      ctx.save();
      ctx.translate(cardX, cardY);
      ctx.rotate(cardRot);

      // Cień
      ctx.shadowColor = 'rgba(50, 38, 28, 0.35)';
      ctx.shadowBlur = 65;
      ctx.shadowOffsetY = 40;

      // Kształt karty
      const cw = 560, ch = 740;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-cw / 2, -ch / 2, cw, ch, [280, 280, 36, 36]);
      ctx.fill();

      // Wycięcie na zdjęcie produktu
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-cw / 2 + 14, -ch / 2 + 14, cw - 28, ch - 28, [270, 270, 28, 28]);
      ctx.clip();

      if (images.bouquet && images.bouquet.complete && images.bouquet.naturalWidth > 0) {
        const zoom = 1.05 + Math.sin(st * 0.7) * 0.04;
        const bw = cw * 1.25 * zoom;
        const bh = bw * (images.bouquet.height / images.bouquet.width);
        ctx.drawImage(images.bouquet, -bw / 2, -bh / 2 + 25, bw, bh);
      } else {
        // Fallback artystyczny
        ctx.fillStyle = '#d9c6b0';
        ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
        drawFlowerPetal(0, -60, 110, '#ffffff', st);
        drawFlowerPetal(-70, 40, 85, '#92b4d8', -st);
        drawFlowerPetal(70, 50, 85, '#e0aa3e', st * 1.5);
      }
      ctx.restore();

      // Złota ramka
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.7)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(-cw / 2, -ch / 2, cw, ch, [280, 280, 36, 36]);
      ctx.stroke();

      // Odznak medalowa "EKO & HANDMADE"
      const badgeProg = Math.min(1, Math.max(0, (st - 0.7) / 0.6));
      if (badgeProg > 0) {
        ctx.save();
        ctx.translate(cw / 2 - 20, -ch / 2 + 70);
        ctx.scale(ease.elasticOut(badgeProg), ease.elasticOut(badgeProg));
        ctx.fillStyle = '#1a1715';
        ctx.beginPath();
        ctx.arc(0, 0, 60, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#f6cf70';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = '800 12px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f6cf70';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("100% WOSK", 0, -10);
        ctx.fillStyle = '#ffffff';
        ctx.fillText("SOJOWY", 0, 8);
        ctx.restore();
      }

      ctx.restore();

      // Dekonstruowane płatki unoszące się wokół produktu (Parallax 3D)
      drawFlowerPetal(w * 0.46, h * 0.28 + Math.sin(st * 3) * 20, 36, '#ffffff', st * 0.8, 0.9);
      drawFlowerPetal(w * 0.92, h * 0.65 + Math.cos(st * 2.5) * 25, 42, '#92b4d8', -st * 0.7, 1.1);
      drawFlowerPetal(w * 0.54, h * 0.82 + Math.sin(st * 2) * 18, 30, '#dfb15b', st * 1.2, 0.8);

      // LEWA KOLUMNA: TYPOGRAFIA I CECHY PRODUKTU (JĘZYK POLSKI)
      ctx.save();
      ctx.translate(140, h * 0.32);

      // Kicker
      const kProg = Math.min(1, st / 0.5);
      if (kProg > 0) {
        ctx.save();
        ctx.globalAlpha = kProg;
        ctx.font = '800 16px "Plus Jakarta Sans"';
        ctx.fillStyle = '#94663e';
        ctx.letterSpacing = '4px';
        ctx.fillText("NOWOŚĆ W OFERCIE WOSQ", 0, 0);
        ctx.restore();
      }

      // Nagłówek
      const hProg = Math.min(1, Math.max(0, (st - 0.25) / 0.6));
      if (hProg > 0) {
        ctx.save();
        ctx.globalAlpha = hProg;
        ctx.translate((1 - ease.outCubic(hProg)) * -60, 60);

        ctx.font = '900 68px "Plus Jakarta Sans"';
        ctx.fillStyle = '#1c1815';
        ctx.fillText("BUKIETY Z WOSKU", 0, 0);

        ctx.font = 'italic 700 60px "Playfair Display"';
        ctx.fillStyle = '#b37847';
        ctx.fillText("Wieczny zapach & zachwyt.", 0, 72);
        ctx.restore();
      }

      // Cechy w bąblach
      const bullets = [
        "Ręcznie odlewane płatki róż, dalii i stokrotek",
        "Aromatyzowane naturalnymi olejkami premium",
        "Trwalsze i piękniejsze niż tradycyjne kwiaty"
      ];

      bullets.forEach((b, i) => {
        const bProg = Math.min(1, Math.max(0, (st - 0.9 - i * 0.25) / 0.5));
        if (bProg > 0) {
          ctx.save();
          const bs = ease.outBack(bProg);
          ctx.translate(0, 230 + i * 82);
          ctx.scale(bs, bs);

          // Pigułka tła
          ctx.fillStyle = '#ffffff';
          ctx.shadowColor = 'rgba(0,0,0,0.06)';
          ctx.shadowBlur = 18;
          ctx.shadowOffsetY = 6;
          ctx.beginPath();
          ctx.roundRect(0, -25, 620, 54, 16);
          ctx.fill();

          // Ikona diamentu
          ctx.fillStyle = '#d4af37';
          ctx.font = '800 20px "Plus Jakarta Sans"';
          ctx.fillText("✦", 20, 8);

          // Tekst
          ctx.fillStyle = '#2d241e';
          ctx.font = '700 18px "Plus Jakarta Sans"';
          ctx.fillText(b, 54, 7);
          ctx.restore();
        }
      });
      ctx.restore();

      // Przejście dynamiczne do sceny 3
      if (st > 6.5) {
        const whip = (st - 6.5) / 0.5;
        ctx.fillStyle = '#111713';
        ctx.fillRect(0, 0, w * ease.inCubic(whip), h);
      }
    }

    // SCENA 3: ŚWIĄTECZNE & BIZNESOWE UPOMINKI (12.0s - 19.0s)
    function renderScene3(t) {
      const st = t - 12.0; // 0.0 - 7.0s
      const w = 1920, h = 1080;

      // Świąteczny, szmaragdowo-leśny luksusowy gradient
      const bg = ctx.createRadialGradient(w * 0.5, h * 0.5, 80, w * 0.5, h * 0.5, 1000);
      bg.addColorStop(0, '#1c2921');
      bg.addColorStop(0.5, '#0f1813');
      bg.addColorStop(1, '#080c0a');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      // Światełka choinkowe / bokeh w tle
      ctx.save();
      for (let i = 0; i < 20; i++) {
        const lx = (Math.sin(i * 47 + st * 0.4) * 0.5 + 0.5) * w;
        const ly = (Math.cos(i * 31 + st * 0.3) * 0.5 + 0.5) * h;
        const rad = 8 + Math.sin(st * 4 + i) * 6;
        ctx.fillStyle = 'rgba(246, 207, 112, 0.35)';
        ctx.shadowColor = '#f6cf70';
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(lx, ly, rad, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      drawParticles(0.85);

      // LEWA STRONA: PREZENTACJA ZDJĘCIA UPOMINKÓW (input_file_2.png)
      const gProg = Math.min(1, st / 0.75);
      const gx = w * 0.36 + (1 - ease.outBack(gProg)) * -300;
      const gy = h * 0.52 + Math.cos(st * 1.8) * 14;
      const gRot = Math.sin(st * 1.4) * 0.02 - 0.01;

      ctx.save();
      ctx.translate(gx, gy);
      ctx.rotate(gRot);

      const fw = 760, fh = 660;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 50;
      ctx.shadowOffsetY = 30;

      // Pływająca tafla szkła
      ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
      ctx.beginPath();
      ctx.roundRect(-fw / 2, -fh / 2, fw, fh, 32);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-fw / 2 + 16, -fh / 2 + 16, fw - 32, fh - 32, 24);
      ctx.clip();

      if (images.gifts && images.gifts.complete && images.gifts.naturalWidth > 0) {
        const pan = Math.sin(st * 0.5) * 30;
        const gw = fw * 1.25;
        const gh = gw * (images.gifts.height / images.gifts.width);
        ctx.drawImage(images.gifts, -gw / 2 + pan, -gh / 2, gw, gh);
      } else {
        // Fallback
        ctx.fillStyle = '#223328';
        ctx.fillRect(-fw / 2, -fh / 2, fw, fh);
      }
      ctx.restore();

      // Złoty obrys ze świąteczną czerwienią
      ctx.strokeStyle = '#f6cf70';
      ctx.lineWidth = 3;
      ctx.strokeRect(-fw / 2 + 16, -fh / 2 + 16, fw - 32, fh - 32);

      // Zawieszka "DOWOLNA PERSONALIZACJA"
      const ribProg = Math.min(1, Math.max(0, (st - 0.7) / 0.5));
      if (ribProg > 0) {
        drawRibbonBadge(0, fh / 2 - 35, "★ DOWOLNA PERSONALIZACJA Z LOGO", '#b92b2b', ease.elasticOut(ribProg));
      }
      ctx.restore();

      // PRAWA STRONA: TEKST I CECHY BIZNESOWE
      ctx.save();
      ctx.translate(w * 0.62, h * 0.32);

      const tKicker = Math.min(1, Math.max(0, st / 0.5));
      if (tKicker > 0) {
        ctx.save();
        ctx.globalAlpha = tKicker;
        ctx.font = '800 16px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f6cf70';
        ctx.letterSpacing = '5px';
        ctx.fillText("PREZENTY FIRMOWE & OKOLICZNOŚCIOWE", 0, 0);
        ctx.restore();
      }

      const tTitle = Math.min(1, Math.max(0, (st - 0.3) / 0.6));
      if (tTitle > 0) {
        ctx.save();
        ctx.globalAlpha = tTitle;
        ctx.translate((1 - ease.outBack(tTitle)) * 60, 60);

        ctx.font = '900 66px "Plus Jakarta Sans"';
        ctx.fillStyle = '#ffffff';
        ctx.fillText("MAGIA ŚWIĄT", 0, 0);

        ctx.fillStyle = '#f6cf70';
        ctx.fillText("& PODZIĘKOWAŃ", 0, 72);
        ctx.restore();
      }

      // Kafelki z korzyściami
      const giftBullets = [
        { main: "Indywidualne bileciki i dedykacje", sub: "Twoje firmowe logo, życzenia lub imiona gości" },
        { main: "Urocze formy: pierniki, choinki, śnieżynki", sub: "Ręcznie malowane złotem detale o aromacie korzennym" },
        { main: "Kompleksowo zapakowane ze wstążką", sub: "Gotowy do wręczenia podarunek klasy premium" }
      ];

      giftBullets.forEach((g, i) => {
        const gp = Math.min(1, Math.max(0, (st - 0.8 - i * 0.25) / 0.5));
        if (gp > 0) {
          ctx.save();
          const gs = ease.outBack(gp);
          ctx.translate(0, 230 + i * 92);
          ctx.scale(gs, gs);

          // Pudełko
          ctx.fillStyle = 'rgba(255, 255, 255, 0.07)';
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.roundRect(0, -32, 600, 76, 16);
          ctx.fill();
          ctx.stroke();

          // Zielony punkt akcentu
          ctx.fillStyle = '#4ade80';
          ctx.shadowColor = '#4ade80';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(28, 6, 7, 0, Math.PI * 2);
          ctx.fill();

          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.font = '800 19px "Plus Jakarta Sans"';
          ctx.fillText(g.main, 52, -4);

          ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
          ctx.font = '500 14px "Plus Jakarta Sans"';
          ctx.fillText(g.sub, 52, 22);
          ctx.restore();
        }
      });
      ctx.restore();

      // Przejście do sceny 4
      if (st > 6.5) {
        const wipe = (st - 6.5) / 0.5;
        ctx.fillStyle = `rgba(10, 8, 7, ${wipe})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // SCENA 4: DYNAMICZNY KINETYCZNY MANIFEST (19.0s - 24.0s)
    // Szybkie cięcia pod uderzenia bitu - zero zacięć
    function renderScene4(t) {
      const st = t - 19.0; // 0.0 - 5.0s
      const w = 1920, h = 1080;

      // Zmiana tła z każdym uderzeniem taktu
      const phase = Math.min(3, Math.floor(st / 1.25));
      const phaseT = (st % 1.25) / 1.25;

      const bgList = ['#100e0c', '#15111b', '#0d161a', '#18110e'];
      ctx.fillStyle = bgList[phase];
      ctx.fillRect(0, 0, w, h);

      // Siatka geometryczna
      ctx.save();
      ctx.strokeStyle = 'rgba(246, 207, 112, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < w; x += 120) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
      }
      for (let y = 0; y < h; y += 120) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
      }
      ctx.restore();

      // Treści kinetyczne
      const manifestos = [
        { main: "100% NATURY", sub: "BEZPIECZNY DLA CIEBIE I DZIECI", color: "#f6cf70" },
        { main: "OBŁĘDNY ZAPACH", sub: "KOMPOZYCJE, KTÓRE WYPEŁNIAJĄ CAŁY DOM", color: "#f472b6" },
        { main: "POLSKI ARTYZM", sub: "RĘCZNA PRECYZJA W KAŻDYM DETALU", color: "#60a5fa" },
        { main: "NA KAŻDĄ OKAZJĘ", sub: "URODZINY • CHRZEST • PODZIĘKOWANIA DLA GOŚCI", color: "#4ade80" }
      ];

      const current = manifestos[phase];

      // Wielka typografia
      ctx.save();
      ctx.translate(w / 2, h / 2);

      const popScale = 0.7 + ease.elasticOut(Math.min(1, phaseT * 2.2)) * 0.3;
      ctx.scale(popScale, popScale);

      // Znak wodny w tle
      ctx.font = '900 240px "Plus Jakarta Sans"';
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(current.main, 0, 0);

      // Główny napis
      ctx.font = '900 120px "Plus Jakarta Sans"';
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = current.color;
      ctx.shadowBlur = 45;
      ctx.fillText(current.main, 0, -25);

      // Pigułka podtytułu
      ctx.font = '800 24px "Plus Jakarta Sans"';
      ctx.fillStyle = current.color;
      ctx.shadowBlur = 15;
      ctx.letterSpacing = '5px';
      ctx.fillText(current.sub, 0, 75);
      ctx.restore();

      // Obiegająca kapsuła z podglądem produktu
      ctx.save();
      const orbitX = Math.sin(st * 4) * 360;
      const orbitY = Math.cos(st * 3) * 110;
      ctx.translate(w / 2 + orbitX, h / 2 + 280 + orbitY);

      const capW = 280, capH = 150;
      ctx.shadowColor = current.color;
      ctx.shadowBlur = 30;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-capW / 2, -capH / 2, capW, capH, 20);
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-capW / 2 + 6, -capH / 2 + 6, capW - 12, capH - 12, 16);
      ctx.clip();
      const prodImg = (phase % 2 === 0) ? images.bouquet : images.gifts;
      if (prodImg && prodImg.complete && prodImg.naturalWidth > 0) {
        ctx.drawImage(prodImg, -capW / 2, -capH / 2 - 25, capW, capW * (prodImg.height / prodImg.width));
      }
      ctx.restore();
      ctx.restore();

      drawParticles(0.9);

      // Rozbłysk do finału (użycie bezpiecznego ease.inQuad zamiast inExpo)
      if (st > 4.5) {
        const flash = (st - 4.5) / 0.5;
        ctx.fillStyle = `rgba(246, 207, 112, ${ease.inQuad(flash)})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    // SCENA 5: WIELKI FINAŁ & WEZWANIE DO DZIAŁANIA (CTA) FACEBOOK (24.0s - 30.0s)
    function renderScene5(t) {
      const st = t - 24.0; // 0.0 - 6.0s
      const w = 1920, h = 1080;

      // Złoto-czarne tło finałowe
      const bg = ctx.createRadialGradient(w / 2, h / 2, 60, w / 2, h / 2, 1000);
      bg.addColorStop(0, '#2b2118');
      bg.addColorStop(0.5, '#120f0d');
      bg.addColorStop(1, '#050403');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);

      drawParticles(1.0);

      // PŁYWAJĄCE KARTY PRODUKTÓW PO BOKACH
      // Bukiet po lewej
      const lp = Math.min(1, st / 0.6);
      ctx.save();
      const lSlide = (1 - ease.outBack(lp)) * -300;
      ctx.translate(w * 0.17 + lSlide, h * 0.52 + Math.sin(st * 2) * 12);
      ctx.rotate(-0.06);
      ctx.shadowColor = 'rgba(0,0,0,0.6)';
      ctx.shadowBlur = 40;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.roundRect(-150, -220, 300, 440, 24);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(-142, -212, 284, 424, 18);
      ctx.clip();
      if (images.bouquet && images.bouquet.complete && images.bouquet.naturalWidth > 0) {
        ctx.drawImage(images.bouquet, -180, -230, 380, 380 * (images.bouquet.height / images.bouquet.width));
      }
      ctx.restore();
      ctx.strokeStyle = '#f6cf70';
      ctx.lineWidth = 3;
      ctx.strokeRect(-150, -220, 300, 440);
      ctx.restore();

      // Upominki po prawej
      const rp = Math.min(1, (st - 0.2) / 0.6);
      if (rp > 0) {
        ctx.save();
        const rSlide = (1 - ease.outBack(rp)) * 300;
        ctx.translate(w * 0.83 + rSlide, h * 0.52 + Math.cos(st * 2) * 12);
        ctx.rotate(0.06);
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.roundRect(-150, -220, 300, 440, 24);
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(-142, -212, 284, 424, 18);
        ctx.clip();
        if (images.gifts && images.gifts.complete && images.gifts.naturalWidth > 0) {
          ctx.drawImage(images.gifts, -180, -220, 380, 380 * (images.gifts.height / images.gifts.width));
        }
        ctx.restore();
        ctx.strokeStyle = '#f6cf70';
        ctx.lineWidth = 3;
        ctx.strokeRect(-150, -220, 300, 440);
        ctx.restore();
      }

      // CENTRUM: LOGO WOSQ
      const logS = ease.elasticOut(Math.min(1, st / 0.6));
      drawWosqLogo(w / 2, h * 0.23, logS * 0.85, 1, (st % 2) / 2);

      // NAGŁÓWEK ZAPROSZENIA
      const tProg = Math.min(1, Math.max(0, (st - 0.4) / 0.6));
      if (tProg > 0) {
        ctx.save();
        ctx.globalAlpha = tProg;
        ctx.translate(w / 2, h * 0.44 + (1 - ease.outBack(tProg)) * 30);

        ctx.font = '800 36px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f6cf70';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '3px';
        ctx.fillText("ZAMÓW SWOJĄ WYMARZONĄ KOMPOZYCJĘ", 0, 0);

        ctx.font = 'italic 500 24px "Playfair Display"';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.fillText("Świece sojowe • Bukiety kwiatowe • Podarunki z dedykacją", 0, 42);
        ctx.restore();
      }

      // PULSUJĄCY PRZYCISK FACEBOOK
      const btnProg = Math.min(1, Math.max(0, (st - 0.8) / 0.6));
      if (btnProg > 0) {
        ctx.save();
        const pulse = 1 + Math.sin(st * 4.5) * 0.025;
        const bScale = ease.elasticOut(btnProg) * pulse;
        ctx.translate(w / 2, h * 0.66);
        ctx.scale(bScale, bScale);

        // Niebieska poświata
        ctx.shadowColor = '#1877f2';
        ctx.shadowBlur = 40;

        // Przycisk
        const bw = 680, bh = 90;
        const btnGrad = ctx.createLinearGradient(-bw / 2, 0, bw / 2, 0);
        btnGrad.addColorStop(0, '#1877f2');
        btnGrad.addColorStop(1, '#0c5ec4');
        ctx.fillStyle = btnGrad;
        ctx.beginPath();
        ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 45);
        ctx.fill();

        // Złoty obrys
        ctx.strokeStyle = '#f6cf70';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Błysk światła
        const shineX = -bw / 2 + ((st * 450) % (bw * 1.8));
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(-bw / 2, -bh / 2, bw, bh, 45);
        ctx.clip();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.transform(1, 0, 0.3, 1, 0, 0);
        ctx.fillRect(shineX, -bh, 60, bh * 2);
        ctx.restore();

        // Ikona Facebooka 'f'
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-bw / 2 + 56, 0, 28, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '900 36px "Plus Jakarta Sans"';
        ctx.fillStyle = '#1877f2';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("f", -bw / 2 + 58, 2);

        // Tekst na przycisku
        ctx.font = '900 26px "Plus Jakarta Sans"';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.letterSpacing = '1.5px';
        ctx.fillText("ODWIEDŹ NAS NA FACEBOOKU", 26, 0);
        ctx.restore();
      }

      // Adres linku i certyfikat jakości
      const lProg = Math.min(1, Math.max(0, (st - 1.2) / 0.5));
      if (lProg > 0) {
        ctx.save();
        ctx.globalAlpha = lProg;
        ctx.translate(w / 2, h * 0.82);

        ctx.font = '700 22px "Plus Jakarta Sans"';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.textAlign = 'center';
        ctx.fillText("facebook.com/share/19etWcsbej/", 0, 0);

        // Znaczek jakości
        ctx.fillStyle = 'rgba(246, 207, 112, 0.15)';
        ctx.strokeStyle = 'rgba(246, 207, 112, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(-240, 20, 480, 36, 18);
        ctx.fill();
        ctx.stroke();

        ctx.font = '800 13px "Plus Jakarta Sans"';
        ctx.fillStyle = '#f6cf70';
        ctx.letterSpacing = '2.5px';
        ctx.fillText("★ AUTORSKIE PROJEKTY • NAJWYŻSZA JAKOŚĆ", 0, 38);
        ctx.restore();
      }

      // Płynne ściemnienie w ostatnich 0.4s
      if (t >= 29.6) {
        const fade = (t - 29.6) / 0.4;
        ctx.fillStyle = `rgba(0, 0, 0, ${fade})`;
        ctx.fillRect(0, 0, w, h);
      }
    }

    /* ==========================================================================
       8. GŁÓWNA PĘTLA RENDERUJĄCA WIDEO
       ========================================================================== */
    function renderVideoFrame(timeSec) {
      ctx.clearRect(0, 0, 1920, 1080);

      // Sprężyste uderzenie kamery pod rytm stopy (Kick Punch)
      let punch = 0;
      if (timeSec >= 5.0 && timeSec <= 29.0) {
        const beatProg = (timeSec * 2) % 1;
        punch = Math.exp(-beatProg * 9) * 0.015;
      }

      ctx.save();
      if (punch > 0.001) {
        ctx.translate(1920 / 2, 1080 / 2);
        ctx.scale(1 + punch, 1 + punch);
        ctx.translate(-1920 / 2, -1080 / 2);
      }

      // Wybór sceny w osi czasu 30.0s
      if (timeSec < 5.0) {
        renderScene1(timeSec);
      } else if (timeSec < 12.0) {
        renderScene2(timeSec);
      } else if (timeSec < 19.0) {
        renderScene3(timeSec);
      } else if (timeSec < 24.0) {
        renderScene4(timeSec);
      } else {
        renderScene5(timeSec);
      }

      ctx.restore();

      // Winieta filmowa
      const vig = ctx.createRadialGradient(960, 540, 600, 960, 540, 1100);
      vig.addColorStop(0, 'rgba(0,0,0,0)');
      vig.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, 1920, 1080);
    }

    function mainLoop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= DURATION) {
          currentTime = DURATION;
          pause();
        }
        handleAudioSync(currentTime);
      }

      renderVideoFrame(currentTime);
      updateControls();

      requestAnimationFrame(mainLoop);
    }

    /* ==========================================================================
       9. INTERAKCJA I STEROWANIE ODTWARZACZEM
       ========================================================================== */
    const startOverlay = document.getElementById('start-overlay');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const restartBtn = document.getElementById('restartBtn');
    const soundBtn = document.getElementById('soundBtn');
    const soundOnIcon = document.getElementById('soundOnIcon');
    const soundOffIcon = document.getElementById('soundOffIcon');
    const fsBtn = document.getElementById('fsBtn');
    const progressBar = document.getElementById('progressBar');
    const scrubber = document.getElementById('scrubber');
    const timeDisplay = document.getElementById('timeDisplay');
    const stageContainer = document.getElementById('stage-container');

    function play() {
      audio.init();
      isPlaying = true;
      if (currentTime >= DURATION) currentTime = 0;
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
      startOverlay.classList.add('hidden');
    }

    function pause() {
      isPlaying = false;
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    }

    function togglePlay() {
      if (isPlaying) pause();
      else play();
    }

    function restart() {
      currentTime = 0;
      lastBeat = -1;
      play();
    }

    function formatTime(s) {
      const sec = Math.floor(s);
      return `00:${sec.toString().padStart(2, '0')}`;
    }

    function updateControls() {
      const pct = (currentTime / DURATION) * 100;
      progressBar.style.width = `${pct}%`;
      timeDisplay.textContent = `${formatTime(currentTime)} / 00:30`;
    }

    scrubber.addEventListener('click', (e) => {
      const rect = scrubber.getBoundingClientRect();
      const pos = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      currentTime = pos * DURATION;
      lastBeat = Math.floor(currentTime * 2);
      renderVideoFrame(currentTime);
      updateControls();
    });

    startOverlay.addEventListener('click', play);
    playBtn.addEventListener('click', togglePlay);
    restartBtn.addEventListener('click', restart);

    soundBtn.addEventListener('click', () => {
      audio.init();
      const muted = audio.toggleMute();
      soundOnIcon.style.display = muted ? 'none' : 'block';
      soundOffIcon.style.display = muted ? 'block' : 'none';
    });

    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        stageContainer.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      }
    });

    // Start wczytywania i odpalenie silnika renderowania
    loadImages(() => {
      console.log("Wszystkie grafiki WOSQ zostały poprawnie zainicjalizowane.");
      requestAnimationFrame(mainLoop);
    });
  </script>
